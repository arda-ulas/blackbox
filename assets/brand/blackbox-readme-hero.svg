<svg xmlns="http://www.w3.org/2000/svg" width="1567" height="721.6" viewBox="0 0 1567 721.6" role="img" aria-label="blackbox inspect shows a stale telemetry reading at step 5; blackbox diff shows the first divergence at step 5 and the work order changing from routine to urgent">
  <rect width="100%" height="100%" rx="14" fill="#0d1117"/>
  <circle cx="26" cy="22" r="6" fill="#30363d"/><circle cx="46" cy="22" r="6" fill="#30363d"/><circle cx="66" cy="22" r="6" fill="#30363d"/>
  <style>
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; font-size: 22px; white-space: pre; fill: #8b949e; opacity: 0; animation: show 0.01s forwards; }
    .cmd { fill: #58a6ff; }
