  <text x="44" y="173" class="out" style="animation-delay:1.34s">    Vehicle.TraveledDistance  {"value":"84391200","ts":"2026-09-28T17:05:00Z"}</text>
  <text x="44" y="204" class="hi" style="animation-delay:1.46s">    Vehicle.Diagnostics.DTCList  {"value":[],"ts":"2026-09-28T17:05:00Z"}</text>
  <text x="44" y="253.6" class="cmd" style="animation-delay:2.18s">$ npx blackbox diff cassettes/triage-incident.json cassettes/triage-hypothesis.json</text>
  <text x="44" y="284.6" class="hi" style="animation-delay:3.08s">First divergence at index 5</text>
