name: CI

on:
  push:
  pull_request:

env:
  NO_COLOR: "1"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22", "24"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run cli -- check
      - name: Fleet-triage example, expected outcome of the run with the fix
        run: npm run cli -- assert examples/fleet-triage/cassettes/triage-fixed.json --expect-status success --expect-tools lookup_dtc,get_telemetry,open_work_order
      - name: Package smoke test (pack, clean install, npx blackbox, JS and TS consumers)
        run: node scripts/pack-smoke.mjs
