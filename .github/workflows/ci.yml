name: CI

on:
  push:
  pull_request:

env:
  NO_COLOR: "1"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22", "24"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run cli -- check
      - name: Package smoke test (pack, clean install, npx blackbox, JS and TS consumers)
        run: node scripts/pack-smoke.mjs
